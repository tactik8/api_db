
services:
  kraken_api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kraken-api-db
    restart: unless-stopped
    ports:
      - "0.0.0.0:3013:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    volumes:
      #- ./uploads:/app/uploads
      - /mnt/nas4:/app/uploads
    healthcheck:
      # Tests the new GET / endpoint on port 3000
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
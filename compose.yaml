
services:
  kraken_api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: upload-api
    restart: unless-stopped
    ports:
      - "0.0.0.0:3012:3013"
    environment:
      - NODE_ENV=production
      - PORT=3013
    volumes:
      #- ./uploads:/app/uploads
      - /mnt/nas4:/app/uploads
    healthcheck:
      # Tests the new GET / endpoint on port 3013
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3013/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s